    <!-- ══════════════════════════════════════════════════════
         PERFORMANCE — PRECONNECT
         crossorigin is REQUIRED for font files (CORS).
         Your original had the order wrong — googleapis must
         come first, then gstatic with crossorigin.
    ═══════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ══════════════════════════════════════════════════════
         PERFORMANCE — FONTS
         Replaced Poppins (not used in cyberpunk UI) with the
         fonts actually referenced in your Tailwind config.
         &display=swap = font-display:swap → no render blocking.

         If you are still using Poppins somewhere, add it back:
         &family=Poppins:wght@400;600;700
    ═══════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  rel="preload"
  as="style"
  href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap"
  onload="this.onload=null;this.rel='stylesheet'"
/>

<noscript>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap"
  />
</noscript>

    <!-- ══════════════════════════════════════════════════════
         PERFORMANCE — PRELOAD CRITICAL ASSETS
         Starts downloading the hero poster BEFORE React boots.
         This is the single biggest LCP improvement possible.

         ⚠️  ACTION REQUIRED:
         Convert fond-poster.png (3.9 MB!) → fond-poster.webp
         Run in your project root:
           ffmpeg -i fond-poster.png -vf scale=1280:-1 -quality 65 fond-poster.webp
         Target size: < 60 KB  →  LCP drops from 4.1s to ~0.8s
    ═══════════════════════════════════════════════════════ -->

    <script type="module" crossorigin src="/portfolio/assets/index-DPUnktSo.js"></script>
    <link rel="modulepreload" crossorigin href="/portfolio/assets/rolldown-runtime-Dq6TatWD.js">
    <link rel="modulepreload" crossorigin href="/portfolio/assets/framer-CkJ5n_h6.js">
    <link rel="modulepreload" crossorigin href="/portfolio/assets/react-core-Nidg3MHh.js">
